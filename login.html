<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in — Studio Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--ink:#17202e;--mute:#667085;--line:#e1e5ec;--bg:#f2f4f7;--acc:#1f7a7a}
@media(prefers-color-scheme:dark){:root{--card:#161d2a;--ink:#e8edf5;--mute:#93a0b4;--line:#253042;--bg:#0e131c;--acc:#4fc3c3}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#141c2b,#1d3a4a)}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mk{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:11px;background:var(--acc);color:#fff;font:700 17px Inter}
h1{font:600 26px Inter;letter-spacing:-.01em;margin:14px 0 20px}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-bottom:12px}
input{width:100%;margin-top:4px;padding:10px 11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.err{color:#c0392b;font-size:13px;min-height:18px;margin:0 0 8px}
button{width:100%;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px;font:600 14px Inter;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<form id="lf">
  <span class="mk">KS</span>
  <h1>Sign in</h1>
  <label>Username<input name="user" required autocomplete="username" autocapitalize="none" autofocus></label>
  <label>Password<input name="pw" type="password" required autocomplete="current-password"></label>
  <p class="err" id="err" role="alert"></p>
  <button id="go">Sign in</button>
</form>
<script>
const UK='ks_admin_users',SK='ks_sess';
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
let U=[];try{U=JSON.parse(localStorage.getItem(UK)||'[]')}catch(e){}
if(U.some(u=>u.user==sessionStorage.getItem(SK)))location.replace('index.html');

// First run only: starter accounts. Change these passwords from "My account" after signing in.
async function seed(){
  const base=[['Owner','admin','owner','Owner@12345'],['Technical admin','tech','tech','Tech@12345']];
  for(const [name,user,role,pw] of base){const salt=rnd();U.push({id:rnd(),name,user,role,salt,hash:await hash(pw,salt)})}
  localStorage.setItem(UK,JSON.stringify(U));
}
let fails=0,lock=0;
document.getElementById('lf').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target),er=document.getElementById('err'),go=document.getElementById('go');
  er.textContent='';
  if(!window.crypto||!crypto.subtle){er.textContent='Open this page over https or localhost to sign in.';return}
  if(Date.now()<lock){er.textContent='Too many attempts. Wait 30 seconds.';return}
  go.disabled=true;
  try{
    if(!U.length)await seed();
    const user=f.get('user').trim().toLowerCase(),u=U.find(x=>x.user==user);
    if(!u||await hash(f.get('pw'),u.salt)!=u.hash){if(++fails>=5){lock=Date.now()+30000;fails=0}er.textContent='Wrong username or password.';return}
    sessionStorage.setItem(SK,u.user);
    location.replace('admin.html');
  }finally{go.disabled=false}
};
</script>
</body>
</html>
